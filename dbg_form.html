<body class="login">
    <div class="top-content">
        <div class="inner-bg">
            <div class="container">
                <div class="row">
                    <div class="col-sm-4 col-sm-offset-4 form-box">
                        <div class="form-top">
                            <a href="http://localhost/opensid/">
                                <img src="http://localhost/opensid/assets/files/logo/opensid_logo.png" alt="" class="img-responsive" style="width: 100px;" />
                                                            </a>
                            <div class="login-footer-top">
                                <h1>Desa </h1>
                                <h3>
                                    <br /><br />Kodepos 
                                    <br />Kecamatan <br />Kabupaten 
                                </h3>
                            </div>
                                                                                </div>
                        <div class="form-bottom">

                                <form id="validasi" class="login-form" action="http://localhost/opensid/siteman/auth" method="post">
        <div class="form-group">
            <input
                name="username"
                type="text"
                autocomplete="off"
                placeholder="Nama pengguna"
                                class="form-username form-control required"
                maxlength="100"
            >
        </div>
        <div class="form-group">
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="off"
                placeholder="Kata sandi"
                                class="form-username form-control required"
                maxlength="100"
            >
        </div>

        

        <div class="form-group">
            <input  type="checkbox" id="checkbox" class="form-checkbox">
            <label for="checkbox" style="font-weight: unset">Tampilkan kata sandi</label>
            <a href="http://localhost/opensid/siteman/lupa_sandi" class="btn" role="button" aria-pressed="true">Lupa kata sandi?</a>
        </div>
        <div class="form-group">
            <button type="submit" class="btn" >Masuk</button>
        </div>

                    <div class="form-group text-center">
                <a href="http://localhost/opensid/siteman/otp/form_login_otp" class="btn" role="button" aria-pressed="true">Masuk dengan OTP</a>
            </div>
            </form>

                            <hr style="margin-top: 5px; margin-bottom: 5px;" />
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        
    <script>
        function start_countdown() {
            let totalSeconds = 0;
            const timer = setInterval(function() {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;

                if (totalSeconds <= 0) {
                    clearInterval(timer);
                    location.reload();
                } else {
                    document.getElementById("countdown").innerHTML = `Terlalu banyak upaya masuk. Silakan coba lagi dalam ${minutes} menit ${seconds} detik.`;
                    totalSeconds--;
                }
            }, 1000);
        }

        $(document).ready(function() {
            var pass = $("#password");
            $('#checkbox').click(function() {
                if (pass.attr('type') === "password") {
                    pass.attr('type', 'text');
                } else {
                    pass.attr('type', 'password')
                }
            });
            if ($('#countdown').length) {
                start_countdown();
            }

            // Hapus localStorage untuk timer OTP login setiap kali halaman login utama dimuat.
            // Ini untuk memastikan timer direset jika pengguna kembali ke halaman ini
            // setelah gagal OTP atau membatalkan proses.
            localStorage.removeItem('otpLoginExpiry');
        });
    </script>
